<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #111; font-family: sans-serif; color: #fff; padding: 24px; }
  h1 { font-size: 18px; margin-bottom: 24px; color: #aaa; }
  .room { margin-bottom: 40px; }
  .room h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 12px; }
  .pair { display: flex; gap: 8px; }
  .pair figure { flex: 1; margin: 0; position: relative; }
  .pair img { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; display: block; }
  .pair figcaption { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.65); font-size: 11px; padding: 3px 8px; border-radius: 4px; }
  .before figcaption { color: #f88; }
  .after figcaption { color: #8f8; }
</style>
</head>
<body>
<h1>Strukturbeskyttelse test — Scandinavian Tier 2 — 30. jul 2026</h1>

<div class="room">
  <h2>Stue med panoramavindue</h2>
  <div class="pair">
    <figure class="before"><img src="/uploads/1784712755569-d4aoio8tcv.jpg"><figcaption>FØR</figcaption></figure>
    <figure class="after"><img src="/uploads/stue-panoramavindue-after.jpg"><figcaption>EFTER</figcaption></figure>
  </div>
</div>

<div class="room">
  <h2>Spisestue med rumdeler</h2>
  <div class="pair">
    <figure class="before"><img src="/uploads/1784809487398-cferev1ep8s.jpeg"><figcaption>FØR</figcaption></figure>
    <figure class="after"><img src="/uploads/spisestue-rumdeler-after.jpg"><figcaption>EFTER</figcaption></figure>
  </div>
</div>

<div class="room">
  <h2>Soveværelse med skråvæg</h2>
  <div class="pair">
    <figure class="before"><img src="/uploads/1784712167259-12f4caiur9tj.JPG"><figcaption>FØR</figcaption></figure>
    <figure class="after"><img src="/uploads/sovevaerelse-skraavaeg-after.jpg"><figcaption>EFTER</figcaption></figure>
  </div>
</div>

<div class="room">
  <h2>Køkken med glasvæg</h2>
  <div class="pair">
    <figure class="before"><img src="/uploads/1784712239799-67ryvgzr9i2.jpeg"><figcaption>FØR</figcaption></figure>
    <figure class="after"><img src="/uploads/koekken-glasvaeg-after.jpg"><figcaption>EFTER</figcaption></figure>
  </div>
</div>

<div class="room">
  <h2>Badeværelse med blå fliser</h2>
  <div class="pair">
    <figure class="before"><img src="/uploads/1784713048738-7ldf88j451u.jpg"><figcaption>FØR</figcaption></figure>
    <figure class="after"><img src="/uploads/badevaerelse-blaa-fliser-after.jpg"><figcaption>EFTER</figcaption></figure>
  </div>
</div>
</body>
</html>
