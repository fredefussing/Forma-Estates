services:
  - type: web
    name: forma-estates
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

databases:
  - name: forma-postgres
    databaseName: formaestates
    user: formaestates
    plan: free
